*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
.label{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:grid;gap:14px;margin-bottom:18px}
.meter{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar{flex:1 1 220px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.meter b{font-variant-numeric:tabular-nums}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.sticky{grid-template-columns:minmax(0,1fr)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none}
@media (max-width:560px){.tabs button{padding:8px 10px;font-size:.92rem}}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

.chip.unit{font-weight:700;border-style:dashed}
.unit-head{font-family:var(--display);font-size:1.7rem;font-weight:800;margin:6px 0 18px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.chip small{font-family:var(--mono);font-size:.7rem;opacity:.8;font-variant-numeric:tabular-nums}

/* Guide */
.deck{margin-bottom:40px}
.deck-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.deck-head .dot{width:12px;height:12px;align-self:center}
.deck-sub{color:var(--muted);margin:0 0 16px;max-width:65ch}
.chain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.chain ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain li{display:flex;align-items:center;gap:6px}
.chain li span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:.9rem}
.chain li+li::before{content:"→";color:var(--muted)}
.tree{font-family:var(--mono);font-size:.82rem;line-height:1.7;white-space:pre;overflow-x:auto;margin:8px 0 0}
.sec{margin:22px 0 8px}
.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:6px 16px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.row .t{font-weight:700}
.row .x{min-width:0}
.hook{display:block;margin-top:4px;font-size:.88rem;color:var(--accent)}
.know{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:.78rem;white-space:nowrap}
.know[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
@media (max-width:560px){.row{grid-template-columns:1fr auto}.row .x{grid-column:1 / -1;grid-row:2}}
.watch{background:var(--warn-soft);color:var(--warn-ink);border-radius:var(--r);padding:12px 14px;margin-top:16px;font-size:.93rem}
.watch b{display:block;margin-bottom:2px}
.compare{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
.compare th,.compare td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.compare th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px}

/* Flashcards */
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:.85rem;font-weight:400}
.btn[aria-pressed="true"]{border-color:var(--ink)}
.card{width:100%;min-height:260px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:28px 24px;display:grid;place-items:center;text-align:center;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(0,0,0,.35);position:relative}
.card .face{max-width:58ch}
.card .big{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.card .def{font-size:1.08rem}
.card .corner{position:absolute;top:14px;left:16px;display:flex;gap:7px;align-items:center}
.card .flipnote{position:absolute;bottom:12px;left:0;right:0;font-size:.8rem;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc-actions .btn{padding:13px}
.kbd{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:10px;text-align:center}
.done{text-align:center;padding:40px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}

/* Quiz */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qprompt{font-size:1.15rem;font-weight:700;margin:0 0 16px;max-width:65ch}
.qprompt .ask{display:block;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:1px 7px;flex:none;margin-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}
.qnav{display:flex;justify-content:flex-end;margin-top:14px}
.setup{display:grid;gap:16px}
.setup p{margin:0;color:var(--muted);max-width:65ch}
.score{font-family:var(--display);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}
.missed{display:grid;gap:8px;margin-top:14px;text-align:left}
.missed div{border-left:3px solid var(--bad);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:.93rem}
.empty{color:var(--muted);padding:20px 0}

/* Settings */
.set-group{display:grid;gap:18px}
.set-group+.set-group{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.set-row{display:grid;gap:7px}
.set-row p{margin:0;color:var(--muted);font-size:.9rem;max-width:65ch}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);font-weight:700}
.qcount{width:5.5em;font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DECKS = [
  {id:'ren', name:'The Renaissance & Humanism', sub:"What the Renaissance was, why it started in Italy, Petrarch, the Greek and Roman classics, humanism, and a liberal arts education. (No class notes for 10.3: this is standard textbook coverage of every 10.3 item on your study guide.)"},
  {id:'art', name:'Renaissance Art & the Printing Press', sub:"The big Renaissance artists, realism, naturalism, linear perspective, and Gutenberg's printing press. (Standard textbook coverage of the 10.3 study guide items.)"},
  {id:'roots', name:'Roots of the Reformation', sub:"Wycliffe and Hus, Christian humanism and Erasmus, corruption in the Church, indulgences, relics, and the Modern Devotion."},
  {id:'luther', name:'Martin Luther & the Break', sub:"Luther's beliefs, the Ninety-five Theses, excommunication, the Diet of Worms, Frederick III, Lutheranism, the printing press, and the Peasants' War."},
  {id:'empire', name:'Charles V & the Peace of Augsburg', sub:"Why Charles V couldn't stop Lutheranism, and what the Peace of Augsburg (1555) decided."},
  {id:'calvin', name:'Zwingli, Calvin & the Anabaptists', sub:"Zwingli in Zürich, John Calvin, predestination and “the elect,” Geneva, and the radical Anabaptists."},
  {id:'england', name:'Reformation in England', sub:"Henry VIII and the annulment, the Act of Supremacy, and how Edward VI, Mary I, and Elizabeth I changed England's religion."},
  {id:'society', name:'Society & the Catholic Reformation', sub:"Education, marriage, women, the Protestant work ethic, anti-Semitism, and how the Catholic Church fought back (Jesuits, Teresa of Ávila, papal reform, the Council of Trent)."}
];
const UNITS = [
  {id:'u3', name:'10.3 Renaissance', decks:['ren','art']},
  {id:'u5', name:'10.5 Reformation', decks:['roots','luther','empire','calvin','england','society']}
];
UNITS.forEach(u=>u.decks.forEach(id=>{DECKS.find(d=>d.id===id).unit=u.id}));
const unitById = Object.fromEntries(UNITS.map(u=>[u.id,u]));
const DECK_VIEW = UNITS.flatMap(u=>u.decks.map(id=>DECKS.find(d=>d.id===id)).sort((a,b)=>!!a.opt-!!b.opt));

// [deck, section, term, definition, hook?]  Append new cards at the end of a deck's block only if you don't mind saved progress shifting.
const RAW = [
// ---------- 10.3 The Renaissance ----------
["ren","What the Renaissance was","The Renaissance","A period of European history from about 1350 to 1550 when people revived interest in the art and learning of ancient Greece and Rome. It began in the Italian city-states and later spread to northern Europe.","Renaissance is French for “rebirth”: the rebirth of classical culture."],
["ren","What the Renaissance was","Why it began in Italy","Italy had wealthy, independent city-states (like Florence, Venice, and Milan) grown rich from trade, and it was surrounded by the ruins and writings of ancient Rome."],
["ren","What the Renaissance was","Florence and the Medici","Florence was a leading Renaissance city-state. The wealthy Medici banking family ruled it and spent their money as patrons of artists and scholars."],
["ren","What the Renaissance was","Patron","A wealthy person or family who pays artists and scholars to create works. Renaissance patrons included merchant families like the Medici and the popes."],
["ren","What the Renaissance was","Secularism","Interest in worldly, everyday life and not only in religion and the afterlife. A big shift from the Middle Ages, though Renaissance people stayed Christian."],
["ren","What the Renaissance was","Individualism","The Renaissance belief in the worth and talent of each person and the importance of individual achievement and fame."],
["ren","What the Renaissance was","Renaissance man (universal man)","A person who is skilled in many fields: art, science, writing, and more. Leonardo da Vinci is the classic example.","“Well-rounded”: good at everything."],
["ren","Humanism","Greek and Roman “classics”","The writings, art, and ideas of ancient Greece and Rome (writers like Cicero, Virgil, Plato, and Aristotle). Renaissance scholars hunted down old manuscripts of them and studied them as models.","Classics = the ancient “greats.”"],
["ren","Humanism","Humanism","The intellectual movement at the heart of the Renaissance. Humanists studied the Greek and Roman classics (grammar, rhetoric, poetry, history, and moral philosophy) and focused on human potential and achievement.","Humanism = focus on humans and what they can do."],
["ren","Humanism","Petrarch","Italian poet and scholar (1304–1374) often called the father of Italian Renaissance humanism. He searched for forgotten Latin manuscripts, admired classical writers like Cicero, and wrote sonnets.","Petrarch = the first humanist: he started the classics hunt."],
["ren","Humanism","Christian humanism (Northern humanism)","Humanism as it spread north of the Alps. It used humanist study of the Bible and early Christian writers to reform the Church and make people more devout. Its leader was Erasmus (more in 10.5)."],
["ren","Humanism","Liberal arts","The humanist education based on the classics: grammar, rhetoric, poetry, history, moral philosophy, plus math and music. Its goal was a well-rounded, virtuous citizen who could take part in public life.","Liberal arts = the education of a “free” (liberal) citizen."],
["ren","Humanism","Vernacular","The everyday language of a region (Italian, English, German, French) instead of Latin. Writing and printing in the vernacular let ordinary people read books, and later the Bible.","Vernacular = the language people actually speak."],

["art","Renaissance art","Realism","An art style that shows people and things as they really look: real faces, real emotions, correct proportions, and believable bodies. A big change from flat, symbolic medieval art."],
["art","Renaissance art","Naturalism","Portraying the human body and the natural world as they appear in nature, based on careful observation. Renaissance artists studied anatomy and nature closely to get it right.","Naturalism = copy nature."],
["art","Renaissance art","Linear perspective","A technique that makes a flat painting look three-dimensional. Lines (called orthogonals) meet at a vanishing point on the horizon, so objects get smaller as they go back.","All lines run to one vanishing point."],
["art","Renaissance art","Fresco","A painting done on wet plaster on a wall or ceiling, so the paint becomes part of the wall. The Sistine Chapel ceiling and The Last Supper are famous Renaissance wall paintings."],
["art","Renaissance art","Renaissance artists' goals","Imitate nature and show people realistically, using perspective, anatomy, light and shadow, and classical (Greek and Roman) styles. Many worked for wealthy patrons and the Church."],
["art","Renaissance artists","Leonardo da Vinci","Italian painter, scientist, and inventor; the ideal “Renaissance man.” Painted the Mona Lisa and The Last Supper and filled notebooks with studies of anatomy and machines.","Leonardo = Mona Lisa + Last Supper + inventions."],
["art","Renaissance artists","Michelangelo","Italian sculptor, painter, and architect. Carved the statue David and painted the ceiling of the Sistine Chapel in Rome. Known for powerful, muscular, idealized human figures."],
["art","Renaissance artists","Raphael","Italian painter known for calm, balanced paintings of the Madonna and for The School of Athens, which shows ancient Greek philosophers like Plato and Aristotle."],
["art","Renaissance artists","Brunelleschi","Florentine architect who designed the huge dome of Florence's cathedral and worked out the rules of linear perspective."],
["art","Renaissance artists","Donatello","Florentine sculptor who made the first free-standing bronze nude since ancient times: his statue of David."],
["art","Renaissance artists","Masaccio","Early Florentine painter whose frescoes were among the first to use linear perspective and realistic, solid-looking figures."],
["art","Renaissance artists","Northern Renaissance artists","Artists like Jan van Eyck and Albrecht Dürer in Flanders and Germany. They painted in oil with extremely fine, realistic detail of everyday objects and people."],
["art","The printing press","Printing press","A machine that used movable metal type to print many copies of a page quickly. Johannes Gutenberg built it in Mainz, Germany, around 1450.","Gutenberg = Germany = 1450."],
["art","The printing press","Johannes Gutenberg","German inventor of the printing press with movable metal type (around 1450)."],
["art","The printing press","Gutenberg Bible","The first major book printed with movable type, around 1455."],
["art","The printing press","Effects of the printing press","Books became cheaper and more common, more people learned to read, ideas (humanist and religious) spread fast, and texts were standardized. By 1500 there were nearly 40,000 titles in print, more than half of them religious.","Cheaper books → more readers → ideas spread."],

// ---------- 10.5 The Protestant Reformation ----------
["roots","Overview","Protestant Reformation","The religious reform movement of the 1500s that split Western Christianity. It was started by the German monk and professor Martin Luther in 1517 and created new Protestant churches separate from the Catholic Church.","Protest + reform = Protestant Reformation."],
["roots","Overview","Intellectual changes of the 1400s","Humanism, Christian humanism, and the printing press laid the groundwork for the Reformation by getting people to read the Bible and question the Church."],
["roots","Wycliffe and Hus","John Wycliffe","English reformer in the late 1300s who criticized the Catholic Church's power and wealth. He saw the Bible as absolute truth (not priests and popes), wanted it translated into English, and believed in predestination and an “invisible church” of the saved.","Wycliffe = English Bible."],
["roots","Wycliffe and Hus","Jan Hus (John Hus)","Czech reformer influenced by Wycliffe. He led reformers who wanted to end clerical corruption and too much papal power. He was condemned as a heretic and executed in 1415, which set off a Czech uprising in Bohemia that lasted until 1436.","Hus = burned 1415 → Bohemia revolts."],
["roots","Wycliffe and Hus","Heretic","A person whose beliefs go against the official teachings of the Church. Heretics could be excommunicated or executed."],
["roots","Christian humanism","Desiderius Erasmus","Leader of Christian humanism. He wanted Christianity to be a guide for daily life, preferred simple early Christianity, and valued inward religious feeling over rituals like pilgrimages, relics, and fasting. He wanted to reform the Church from within, not leave it.","“Erasmus laid the egg that Luther hatched.”"],
["roots","Christian humanism","In Praise of Folly (1509)","Erasmus's book that used satire to mock the moral and religious state of society and the abuses of the Catholic Church."],
["roots","Christian humanism","“Erasmus laid the egg that Luther hatched”","A saying that means Erasmus's criticism of the Church paved the way for Luther's Reformation, even though Erasmus himself never meant to break from the Church."],
["roots","The need for reform","Corruption in the Catholic Church","Renaissance popes cared more about politics, wars, and wealth than spiritual needs. Clergy used Church offices for personal gain and failed to guide parishioners, so ordinary people were left without the spiritual help they wanted."],
["roots","The need for reform","Clergy","Church officials such as priests, bishops, and popes."],
["roots","The need for reform","Parishioners","Ordinary church members. They wanted meaningful religion and assurance of salvation, so they turned to relics and indulgences instead of their priests."],

["luther","Martin Luther's beliefs","Salvation through faith alone","Luther's central belief: people are saved only by faith in God, not by good works. The Catholic Church taught that both faith and good works were needed.","Faith ALONE = no works needed for salvation."],

["luther","Lutheranism","Printing press and the Reformation","The printing press spread Luther's ideas fast and made cheaper Bibles available to more people. It helped Protestantism spread “big time.”"],

function fcAnswer(got){
  const f=S.fc, id=f.q[f.i];
  setKnown(id,got);
  f.q.splice(f.i,1); f.seen++;
  if(!got){ f.q.splice(Math.min(f.q.length,4),0,id); f.total++; }
  f.flipped=false; if(f.i>=f.q.length) f.i=0;
  renderCards();
}

/* ---------- Quiz ---------- */
/* Distractor safety: never offer a wrong answer that is about the same thing as the right one
   (a disorder and its symptoms, a term and a card that names it, near-identical definitions). */
const STOP=new Set('the a an and or of to in on for with by is are be as at it its that this from your you can when which who their they them not no than more most like such'.split(' '));
function aliases(t, full){
  t=t.toLowerCase(); const out=new Set();
  (t.match(/\(([^)]+)\)/g)||[]).forEach(m=>out.add(m.slice(1,-1).trim()));
  let core=t.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim().replace(/^(symptoms|signs|causes?|results|health risks|other) of /,'').replace(/^(the|other) /,'');
  out.add(core); if(!full) core.split(/:| vs\.? | and /).forEach(x=>out.add(x.trim()));
  // drop a plural s so "Bipolar disorders" also matches "bipolar disorder"
  return [...out].map(x=>x.replace(/^(symptoms|signs|causes?) of /,'').trim().replace(/([^si])s$/,'$1')).filter(x=>x.length>=3&&!STOP.has(x));
}
const hasWord=(hay,w)=>new RegExp('(^|[^a-z0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es)?([^a-z0-9]|$)').test(hay);
const CARD_INFO=new Map();
const info=c=>{let v=CARD_INFO.get(c.id); if(!v){v={main:aliases(c.t,true),t:c.t.toLowerCase(),x:c.x.toLowerCase()}; CARD_INFO.set(c.id,v)} return v};
// A card whose definition names 3+ other cards in its deck is a summary/list card.
const listed=c=>{const I=info(c); if(I.list===undefined) I.list=CARDS.filter(o=>o.d===c.d&&o.id!==c.id&&info(o).main.some(w=>hasWord(I.x,w)));return I.list};
const PAIR_KEYS=new Set();
function related(a,b){
  if(a.id===b.id) return true;
  const ka=a.d+'|'+a.t, kb=b.d+'|'+b.t;
  if(PAIRS.has(ka+'~'+kb)) return true;
  // Same approach across topics ("Psychodynamic perspective" / "Psychodynamic explanation")
  const fa=a.t.toLowerCase().split(/[\s&]/)[0], fb=b.t.toLowerCase().split(/[\s&]/)[0];
  if(fa===fb&&APPROACH.has(fa)&&a.d!==b.d) return true;
  const A=info(a), B=info(b);
  // one card is about the other: its full name is inside the other's name ("GAD" / "Symptoms of GAD")
  const general=GENERAL.has(ka)!==GENERAL.has(kb);
  if(!general&&(A.main.some(w=>hasWord(B.t,w))||B.main.some(w=>hasWord(A.t,w)))) return true;
  // a list card and one of the things it lists
  const la=listed(a), lb=listed(b);
  return (la.length>=3&&la.includes(b))||(lb.length>=3&&lb.includes(a));
}
const PAIRS=new Set();
UMBRELLA.forEach(k=>{const d=k.split('|')[0]; PAIR_KEYS.add(k); ALL_CARDS.filter(c=>c.d===d).forEach(c=>{const o=c.d+'|'+c.t; if(o!==k){PAIRS.add(k+'~'+o);PAIRS.add(o+'~'+k)}})});
PAIR_GROUPS.forEach(g=>{const hub=g[0]==='*'?null:g[0], rest=g.slice(1), all=hub?[hub,...rest]:rest;
  const add=(x,y)=>{PAIRS.add(x+'~'+y);PAIRS.add(y+'~'+x)};
  if(hub) rest.forEach(m=>add(hub,m)); else rest.forEach((x,i)=>rest.slice(i+1).forEach(y=>add(x,y)));
  all.forEach(k=>PAIR_KEYS.add(k));});
function safeDistractors(c, ordered, n){
  const out=[], seen=new Set([c.id]);
  for(const x of ordered){ if(out.length>=n) break; if(seen.has(x.id)) continue; seen.add(x.id);
    if(related(c,x)||out.some(y=>related(x,y))) continue; out.push(x); }
  return out;
}
// Hide a card's own term inside its definition so the definition can't give the answer away.
function maskDef(c){
  let x=c.x; const al=new Set(info(c).main);
  // also the words of a multi-word term on their own when they're distinctive ("Stroop", "Hawthorne", "Weber's")
  c.t.replace(/\([^)]*\)/g,' ').split(/[\s:\/,]+/).forEach(w=>{w=w.toLowerCase().replace(/[^a-z0-9'-]/g,''); if(w.length>=4&&!STOP.has(w)&&!COMMON.has(w)){const b=w.replace(/([^si])s$/,'$1'); al.add(b); if(/ance$|ence$/.test(b)) al.add(b.slice(0,-2)+'t');}});
  [...al].sort((a,b)=>b.length-a.length).forEach(w=>{
    x=x.replace(new RegExp('(^|[^A-Za-z0-9])('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(s|es|ly)?(?=[^A-Za-z0-9]|$)','gi'),'$1___');
  });
  return x;
}
const COMMON=new Set('church catholic reformation protestant faith bible king queen pope peace war disorder disorders symptoms causes cause theory effect system nervous therapy therapies personality depressive episode stage behavioral cognitive biological social cultural genetic sleep sensory motor visual field right left primary cortex lobe cells sense hearing threshold processing perception research sample group variable correlation positive negative explanation perspective example examples criteria medications model analysis left right body when does good cons fear mean cell sign signs cues area scan role time skip their what with whole'.split(' '));
function genQuestion(c, pool, nOpts){
  pool = (pool||cardsNow()).filter(x=>x.id!==c.id); nOpts = nOpts||4;
  const same = shuffle(pool.filter(x=>x.d===c.d&&x.s===c.s));
  const deck = shuffle(pool.filter(x=>x.d===c.d&&x.s!==c.s));
  const rest = shuffle(pool.filter(x=>x.d!==c.d)).concat(shuffle(CARDS.filter(x=>x.d!==c.d&&inAll(x.d))));
  const distract = safeDistractors(c, same.concat(deck,rest), nOpts-1);
  const dir = S.set.quizDir, reverse = dir==='term'?true:dir==='def'?false:Math.random()<0.3;
  const all = shuffle([c].concat(distract));
  return reverse
    ? {kind:'card', type:'mc', card:c, ask:'Which definition matches this term?', prompt:c.t, opts:all.map(maskDef), ans:all.indexOf(c), exp:`${c.t}: ${c.x}`}
    : {kind:'card', type:'mc', card:c, ask:'Which term matches this definition?', prompt:maskDef(c), opts:all.map(x=>x.t), ans:all.indexOf(c), exp:`${c.t}: ${c.x}`+(c.h&&S.set.hooks?` (Hook: ${c.h})`:'')};
}
// True/false: half the time the definition shown belongs to a different, nearby term.
function tfQuestion(c, pool){
  let shown=c;
  if(Math.random()<0.5){
    const near=shuffle(pool.filter(x=>x.id!==c.id&&x.d===c.d&&x.s===c.s)).concat(shuffle(pool.filter(x=>x.id!==c.id&&x.d===c.d)),shuffle(pool.filter(x=>x.id!==c.id)));
    shown=near.find(x=>x.x!==c.x&&!related(c,x))||c;
  }
  return {kind:'card', type:'tf', card:c, ask:'True or false?', prompt:`${c.t}: ${maskDef(shown)}`, opts:['True','False'], ans:shown===c?0:1,
    exp:shown===c?`True. ${c.t}: ${c.x}`:`False. That describes ${shown.t}. ${c.t}: ${c.x}`};
}
function scenQuestion(s){
  const o=shuffle(s[2].map((t,i)=>({t,i})));
  return {kind:'scen', type:'scen', deck:s[0], ask:'Apply it', prompt:s[1], opts:o.map(x=>x.t), ans:o.findIndex(x=>x.i===s[3]), exp:s[4]};
}
function examQuestion(e){
  const o=shuffle(e[2].map((t,i)=>({t,i})));
  return {kind:'scen', type:'exam', deck:e[0], ask:'Choose the best answer', prompt:e[1], opts:o.map(x=>x.t), ans:o.findIndex(x=>x.i===e[3]), exp:e[4]};
}
const TYPE_NAME={exam:'Exam-style',mc:'Multiple choice',tf:'True / false',scen:'Scenarios'};
function newQuiz(qs, extra){
  S.quizNote='';
  S.quiz=Object.assign({qs,i:0,picked:null,right:0,missed:[],res:[],n:qs.length,answers:[]},extra||{});
  renderQuiz();
}
function startQuiz(n, onlyIds){
  let cs = onlyIds?CARDS.filter(c=>onlyIds.includes(c.id)):cardsNow();
  let sc = onlyIds?[]:SCEN.filter(s=>deckIn(s[0]));
  const mix = S.set.quizMix, focus = S.set.quizFocus;
  if(!onlyIds&&focus==='weak'){ cs=cs.filter(c=>S.miss[c.id]); if(mix!=='scen') sc=[]; }
  const nS = onlyIds||mix==='terms'?0:Math.min(sc.length, mix==='scen'?n:Math.round(n*0.4));
  const order = focus==='random'?shuffle(cs):shuffle(cs.filter(c=>!S.known[c.id])).concat(shuffle(cs.filter(c=>S.known[c.id])));
  const nC = onlyIds?cs.length:mix==='scen'?0:Math.min(order.length, n-nS);
  const qs = shuffle(shuffle(sc).slice(0,nS).map(scenQuestion).concat(order.slice(0,nC).map(c=>genQuestion(c))));
  if(!qs.length){S.quiz=null;S.quizNote=focus==='weak'?'No trouble terms in this set yet. Terms you miss in Learn lessons show up here. Change "Focus" in Settings to quiz everything.':'No questions match your settings for this deck. Try a different question type in Settings.';renderQuiz();return}
  newQuiz(qs);
}

/* Custom test builder: its own saved config, separate from progress. */
const DEF_TEST = {decks:DECKS.filter(d=>!d.opt).map(d=>d.id), exam:10, mc:15, tf:5, scen:5, choices:4, feedback:'end', order:'mixed'};
S.test = Object.assign({}, DEF_TEST, store.get('h10-test',{}));
S.test.decks = S.test.decks.filter(id=>deckById[id]);
const saveTest = ()=>store.set('h10-test',S.test);
const testPool = (decks=S.test.decks)=>({cards:CARDS.filter(c=>decks.includes(c.d)), scen:SCEN.filter(s=>decks.includes(s[0])), exam:EXAM.filter(e=>decks.includes(e[0]))});
function syncTestInputs(){
  [['exam','texam'],['mc','tmc'],['tf','ttf'],['scen','tscen']].forEach(([k,id])=>{const el=$('#'+id); if(el) S.test[k]=Math.max(0,Math.min(200,parseInt(el.value,10)||0));});
  saveTest();
}
// cfg is passed for Exam mode and "same settings" reruns; otherwise use the builder's saved config.
function startTest(cfg){
  if(!cfg) syncTestInputs();
  const T=Object.assign({}, cfg||S.test), P=testPool(T.decks);
  const mcN=Math.min(T.mc,P.cards.length), scN=Math.min(T.scen,P.scen.length), exN=Math.min(T.exam||0,P.exam.length);
  // Use different terms for multiple choice and true/false when there are enough to go around.
  const deal=shuffle(P.cards), mcCards=deal.slice(0,mcN), left=deal.slice(mcN);
  const tfCards=left.concat(shuffle(mcCards)).slice(0,Math.min(T.tf,P.cards.length));
  const groups={mc:mcCards.map(c=>genQuestion(c,P.cards,T.choices)), tf:tfCards.map(c=>tfQuestion(c,P.cards)), scen:shuffle(P.scen).slice(0,scN).map(scenQuestion), exam:shuffle(P.exam).slice(0,exN).map(examQuestion)};
  const qs=T.order==='grouped'?groups.exam.concat(groups.mc,groups.tf,groups.scen):shuffle(groups.exam.concat(groups.mc,groups.tf,groups.scen));
  if(!qs.length){S.quiz=null;S.quizNote=!T.decks.length?'Pick at least one topic for your test.':'Your test has 0 questions. Set at least one question count above 0.';renderQuiz();return}
  const short=!T.examMode&&((T.exam||0)>exN||T.mc>mcN||T.scen>scN||T.tf>tfCards.length)?`Some counts were higher than these topics have, so the test uses all available: ${exN} exam-style, ${mcN} multiple choice, ${tfCards.length} true/false, ${scN} scenario.`:'';
  newQuiz(qs,{test:true, atEnd:T.feedback==='end', short, decks:T.decks.slice(), cfg:T});
}
function gradeTest(){
  const Q=S.quiz;
  Q.qs.forEach((q,i)=>{const a=Q.answers[i]; recordAnswer(q, a===undefined?null:a);});
  Q.i=Q.n; renderQuiz();
}
function recordAnswer(q, a){
  const Q=S.quiz, ok=a===q.ans;
  Q.res.push({q,ok,a});
  if(ok) Q.right++; else { Q.missed.push(Object.assign({},q,{yours:a})); if(q.card) setKnown(q.card.id,false); }
}

let qTimer=null;
function clearQTimer(){clearInterval(qTimer);qTimer=null}
// Per question normally; in "answers at the end" mode the same setting becomes a whole-test limit.
function startQTimer(){
  const Q=S.quiz, idx=Q.i, whole=Q.atEnd;
  if(whole){ if(!Q.deadline) Q.deadline=Date.now()+S.set.timer*1000*Q.n; }
  else if(Q.deadlineFor!==idx){Q.deadlineFor=idx;Q.deadline=Date.now()+S.set.timer*1000}
  const tick=()=>{
    if(S.tab!=='quiz'||S.quiz!==Q||Q.i>=Q.n||(!whole&&(Q.i!==idx||Q.picked!==null))){clearQTimer();return}
    const s=Math.max(0,Math.ceil((Q.deadline-Date.now())/1000)), el=$('#qtime');
    if(el){el.textContent=whole?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} left`:s+'s';el.classList.toggle('low',whole?s<=30:s<=5)}
    if(s<=0){clearQTimer(); whole?gradeTest():pick(-1)}
  };
  tick(); if(S.quiz===Q&&Q.i<Q.n&&(whole||Q.picked===null)) qTimer=setInterval(tick,250);
}

    const optStart=!deck.opt?LESSONS.findIndex(l=>deckById[l.d].opt):-1;
    const optNext=S.li===LAST_CORE&&optStart>=0?`<button class="btn" data-lesson="${optStart}">Optional: ${esc(deckById[LESSONS[optStart].d].name.replace(/^Optional: /,''))}</button>`:'';
    h+=`<div class="qbox">${head}<div class="score" style="font-size:2.4rem">${L.first}/${L.firstTotal}</div><p class="deck-sub">right on the first try.${missed.length?' The terms below gave you trouble. They\'ll show up again as review questions in later lessons.':' Clean lesson.'}</p>
      ${missed.length?`<div class="missed">${missed.map(c=>`<div><b>${esc(c.t)}</b>: ${esc(c.x)}</div>`).join('')}</div>`:''}
      ${L.scenMiss.length?`<div class="missed" style="margin-top:8px">${L.scenMiss.map(q=>`<div>${esc(q.prompt)} <b>${esc(q.opts[q.ans])}</b>. ${esc(q.exp)}</div>`).join('')}</div>`:''}
      ${scoped&&last?`<div class="watch" style="margin-top:16px"><b>End of ${esc(scopeLabel(S.deck))}.</b>${scopeDone===SL.length?'You finished every lesson in it. ':`${SL.length-scopeDone} lesson${SL.length-scopeDone>1?'s':''} in it ${SL.length-scopeDone>1?'are':'is'} still unfinished (see the lesson map). `}Test yourself on the whole unit.</div>`:''}
      ${!scoped&&allDone&&last?`<div class="watch" style="margin-top:16px"><b>You finished every lesson.</b>Now take a 40-question mixed quiz on everything and retry what you miss.</div>`:''}
      <div class="qnav" style="gap:8px;flex-wrap:wrap"><button class="btn" data-act="l-redo">Redo this lesson</button>${last&&scoped?`<button class="btn" data-act="l-scopeexam">${esc(scopeLabel(S.deck))} practice exam</button><button class="btn primary" data-act="l-scopequiz">Take a ${esc(scopeLabel(S.deck))} quiz</button>`:last?`${optNext}<button class="btn primary" data-act="l-final">Take the final mixed quiz</button>`:`<button class="btn primary" data-lesson="${nextIdx}">Next lesson: ${esc(lessonTitle(nextIdx))}</button>`}</div></div>`;
  }
  $('#view').innerHTML=h;
}

/* ---------- Settings ---------- */
const SETTINGS = [
  {g:'Display'},
  {k:'theme', label:'Theme', opts:[['auto','Match device'],['light','Light'],['dark','Dark']]},
  {k:'size', label:'Text size', opts:[['s','Small'],['m','Normal'],['l','Large'],['xl','Extra large']]},
  {k:'hooks', label:'Memory hooks', help:'Hide them to test whether you know the term without the trick.', opts:[[true,'Show'],[false,'Hide']]},
  {g:'Flashcards'},
  {k:'fcPool', label:'Which cards', help:'Trouble terms are cards you\'ve missed in Learn lessons and haven\'t fixed yet.', opts:[['unknown','Not known yet'],['all','All cards'],['weak','Trouble terms']]},
  {k:'fcOrder', label:'Order', help:'In order follows the study guide, section by section.', opts:[['shuffle','Shuffled'],['section','In order']]},
  {g:'Quiz'},
  {k:'quizMix', label:'Question type', opts:[['mixed','Mixed'],['terms','Terms only'],['scen','Scenarios only']]},
  {k:'quizDir', label:'Term questions ask', opts:[['mixed','Both ways'],['def','Definition → term'],['term','Term → definition']]},
  {k:'quizFocus', label:'Focus', help:'"Not known first" pulls cards you haven\'t marked “got it” before the rest.', opts:[['unknown','Not known first'],['random','Random'],['weak','Trouble terms']]},
  {k:'timer', label:'Timer per question', help:'Running out of time counts as a miss. Timers only apply to the Quiz tab, not Learn.', opts:[[0,'Off'],[15,'15s'],[30,'30s'],[60,'60s']]}
];
function renderSettings(){
  let h='<div class="qbox">', open=false;
  SETTINGS.forEach(s=>{
    if(s.g){h+=(open?'</div>':'')+`<div class="set-group"><h2>${esc(s.g)}</h2>`;open=true;return}
    h+=`<div class="set-row"><div class="label">${esc(s.label)}</div><div class="seg">${s.opts.map(([v,l])=>`<button class="btn small" data-set="${s.k}" data-val="${esc(JSON.stringify(v))}" aria-pressed="${S.set[s.k]===v}">${esc(l)}</button>`).join('')}</div>${s.help?`<p>${esc(s.help)}</p>`:''}</div>`;
  });
  const known=CARDS.filter(c=>S.known[c.id]).length, weak=CARDS.filter(c=>S.miss[c.id]).length;
  h+=`</div><div class="set-group"><h2>Your progress</h2>
    <p class="deck-sub" style="margin:0">${known} terms marked “got it,” ${S.done.length} lessons done, ${weak} trouble terms. Progress is saved in this browser only. Back it up before clearing your browser data or switching devices.</p>
    <div class="toggle"><button class="btn" data-act="export">Download backup</button><button class="btn" data-act="import">Restore from backup</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <p id="dataNote" class="deck-sub" style="margin:0" aria-live="polite"></p>
    <div class="toggle"><button class="btn small" data-act="defaults">Reset settings to default</button></div>
    <p class="deck-sub" style="margin:0;font-size:.88rem">Resetting settings never changes your progress. To erase progress, use “Reset progress” at the top.</p></div></div>`;
  $('#view').innerHTML=h;
}
function exportProgress(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith('h10-')) data[k]=localStorage.getItem(k);}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'history-ch10',saved:new Date().toISOString(),data},null,1)],{type:'application/json'}));
  a.download=`history-ch10-progress-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importProgress(file){
  const note=$('#dataNote');
  file.text().then(txt=>{
    const j=JSON.parse(txt), d=j&&j.app==='history-ch10'&&j.data;
    if(!d||typeof d!=='object'||!Object.keys(d).length||Object.entries(d).some(([k,v])=>!k.startsWith('h10-')||typeof v!=='string')) throw 0;
    if(!confirm('Restore this backup? It replaces the progress saved in this browser.')) return;
    Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,v));
    location.reload();
  }).catch(()=>{note.textContent='That file isn\'t a backup from this study kit. Nothing was changed.'});
}

/* ---------- Wiring ---------- */
function render(){renderTabs();renderChips();renderMeter();$('#chips').hidden=S.tab==='settings'||(S.tab==='quiz'&&!!(S.quiz&&S.quiz.test)); if(S.tab==='learn')renderLearn(); else if(S.tab==='guide')renderGuide(); else if(S.tab==='cards')renderCards(); else if(S.tab==='settings')renderSettings(); else renderQuiz();}
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]) importProgress(e.target.files[0]); else if(['tmc','ttf','tscen'].includes(e.target.id)) syncTestInputs();});
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;store.set('h10-tab2',S.tab);render();window.scrollTo({top:0});return}
  if(t.dataset.goto){S.tab=t.dataset.goto;store.set('h10-tab2',S.tab);if(S.tab==='cards')S.fc=null;if(S.tab==='quiz')S.quiz=null;render();return}
  if(t.dataset.scopeLearn){startScopeLearn(t.dataset.scopeLearn);return}
  if(t.dataset.scopeQuiz){setQuizScope(t.dataset.scopeQuiz);return}
  if(t.dataset.lesson!==undefined){startLesson(+t.dataset.lesson);return}
  if(t.dataset.lopt!==undefined){learnPick(+t.dataset.lopt);return}
  if(t.dataset.deck){S.deck=t.dataset.deck;store.set('h10-deck',S.deck);S.fc=null;S.quiz=null;
    if(S.tab==='learn'&&S.deck!=='all'){const ls=DECK_VIEW.filter(d=>deckIn(d.id)&&(!d.opt||S.deck===d.id)).flatMap(d=>LESSONS.map((l,i)=>i).filter(i=>LESSONS[i].d===d.id&&!LESSONS[i].skip));startLesson(ls.find(i=>!S.done.includes(i))??ls[0]);renderChips();return}
    render();return}
  if(t.dataset.act&&t.dataset.act.startsWith('l-')){
    const a=t.dataset.act;
    if(a==='l-map'){S.showMap=!S.showMap;renderLearn()}
    else if(a==='l-quiz'){beginLessonQuiz();window.scrollTo({top:0})}
    else if(a==='l-next'){nextLearnQ()}
    else if(a==='l-nextlesson'){startLesson(S.li+1)}
    else if(a==='l-redo'){startLesson(S.li)}
    else if(a==='l-scopequiz'){S.tab='quiz';store.set('h10-tab2','quiz');setQuizScope(S.deck);render();startQuiz(30);window.scrollTo({top:0})}
    else if(a==='l-scopeexam'){const sc=S.deck;S.tab='quiz';store.set('h10-tab2','quiz');setQuizScope(sc);render();startTest(examCfg(30));window.scrollTo({top:0})}
    else if(a==='l-final'){S.deck='all';store.set('h10-deck','all');S.tab='quiz';store.set('h10-tab2','quiz');render();startQuiz(40)}
    return;
  }
  if(t.dataset.tdeck||t.dataset.tset||(t.dataset.act||'').startsWith('t-')){
    if($('#tmc')) syncTestInputs();
    const T=S.test, a=t.dataset.act;
    if(t.dataset.tdeck){const id=t.dataset.tdeck; T.decks=T.decks.includes(id)?T.decks.filter(x=>x!==id):DECKS.map(d=>d.id).filter(x=>x===id||T.decks.includes(x))}
    else if(t.dataset.tset) T[t.dataset.tset]=JSON.parse(t.dataset.val);
    else if(a==='t-core') T.decks=DECKS.filter(d=>!d.opt).map(d=>d.id);
    else if(a==='t-unit') T.decks=DECKS.filter(d=>d.unit===t.dataset.unit&&!d.opt).map(d=>d.id);
    else if(a==='t-every') T.decks=DECKS.map(d=>d.id);
    else if(a==='t-none') T.decks=[];
    else if(a==='t-start'){startTest();window.scrollTo({top:0});return}
    else if(a==='t-again'){startTest(S.quiz&&S.quiz.cfg);window.scrollTo({top:0});return}
    else if(a==='t-next'){testNav(1);return}
    else if(a==='t-back'){testNav(-1);return}
    else if(a==='t-finish'){finishTest();return}
    saveTest(); S.quizNote=''; renderQuiz(); return;
  }
  if(t.dataset.set){S.set[t.dataset.set]=JSON.parse(t.dataset.val);saveSet();applySet();S.fc=null;S.quiz=null;S.quizNote='';render();return}
  if(t.dataset.know){const id=t.dataset.know;setKnown(id,!S.known[id]);t.setAttribute('aria-pressed',!!S.known[id]);t.textContent=S.known[id]?'✓ Got it':'Got it?';return}
  if(t.dataset.quiz){startQuiz(+t.dataset.quiz);return}
  if(t.dataset.opt!==undefined){pick(+t.dataset.opt);return}
  const a=t.dataset.act;
  if(a==='flip'){S.fc.flipped=!S.fc.flipped;renderCards()}
  else if(a==='got')fcAnswer(true);
  else if(a==='learning')fcAnswer(false);
  else if(a==='shuffle'||a==='again'){S.fc=null;renderCards()}
  else if(a==='front'){S.fcFront=S.fcFront==='term'?'def':'term';store.set('h10-front',S.fcFront);S.fc.flipped=false;renderCards()}
  else if(a==='only'||a==='pool-all'){S.set.fcPool=a==='pool-all'?'all':POOL_NEXT[S.set.fcPool];saveSet();S.fc=null;renderCards()}
  else if(a==='next'){S.quiz.i++;S.quiz.picked=null;renderQuiz();window.scrollTo({top:0})}
  else if(a==='retry'){startQuiz(0,S.retryIds)}
  else if(a==='newquiz'){S.quiz=null;renderQuiz()}
  else if(a==='exam'){startTest(examCfg(+t.dataset.n));window.scrollTo({top:0})}
  else if(a==='customquiz'){const n=Math.max(1,Math.min(200,parseInt($('#qcount').value,10)||15));store.set('h10-qcount',n);startQuiz(n)}
  else if(a==='export')exportProgress();
  else if(a==='import')$('#importFile').click();
  else if(a==='defaults'){S.set=Object.assign({},DEF_SET);saveSet();applySet();S.fc=null;S.quiz=null;render()}
});
$('#reset').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(b.dataset.confirm){S.known={};store.set('h10-known',{});S.fc=null;S.done=[];S.miss={};S.li=0;S.L=null;store.set('h10-done',[]);store.set('h10-miss',{});store.set('h10-li',0);b.textContent='Reset progress';delete b.dataset.confirm;render();}
  else{b.dataset.confirm='1';b.textContent='Tap again to confirm';setTimeout(()=>{if(b.dataset.confirm){delete b.dataset.confirm;b.textContent='Reset progress'}},3000)}
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  if(S.tab==='learn'&&S.L){
    const L=S.L;
    if(L.phase==='quiz'){
      const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3}[e.key.toLowerCase()];
      if(m!==undefined&&L.picked===null)learnPick(m);
      else if(e.key==='Enter'&&L.picked!==null){e.preventDefault();nextLearnQ()}
    }
    return;
  }
  if(S.tab==='cards'&&S.fc&&S.fc.q.length){
    if(e.code==='Space'){e.preventDefault();S.fc.flipped=!S.fc.flipped;renderCards()}
    else if(e.key==='1')fcAnswer(false); else if(e.key==='2')fcAnswer(true);
  } else if(S.tab==='quiz'&&S.quiz&&S.quiz.i<S.quiz.qs.length){
    const m={a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4}[e.key.toLowerCase()];
    if(S.quiz.atEnd){
      if(m!==undefined)pick(m);
      else if(e.key==='Enter'){e.preventDefault();testNav(1)}
      else if(e.key==='ArrowLeft')testNav(-1);
    }
    else if(m!==undefined&&S.quiz.picked===null)pick(m);
    else if(e.key==='Enter'&&S.quiz.picked!==null){S.quiz.i++;S.quiz.picked=null;renderQuiz()}
  }
});
render();
</script>

</body></html>
